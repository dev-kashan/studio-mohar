<a href="/shop/{{ occasion.slug }}/" class="sm-occasion-card{% if occasion.image %} has-photo{% endif %}" style="--card:{{ occasion.card_color }}; --card-ink:{% if occasion.text_tone == 'light' %}#FFFFFF{% else %}#1D1D1B{% endif %}">
    {% if occasion.image %}<img src="{{ occasion.image.url }}" alt="" loading="lazy">{% endif %}
    <span class="sm-occasion-name">{{ occasion.name }}</span>
    {% if occasion.subtitle %}<span class="sm-occasion-line">{{ occasion.subtitle }}</span>{% endif %}
</a>
