{% if page.inspo_on %}
<!-- "Upload inspo" card (first spot in the grid): opens the file picker, then the popup -->
<button type="button" class="pl-inspo-card" data-inspo-open>
    <span class="pl-inspo-icon" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="6" y="14" width="44" height="40" rx="8" fill="#DDE6D8"/><path d="M12 48l12-14 9 10 6-6 11 10H12z" fill="#5A6F52"/><circle cx="20" cy="26" r="5" fill="#5A6F52"/><path d="M48 6v16M40 13l8-8 8 8" stroke="#3E4F38" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="pl-inspo-text">{{ page.inspo_card_text }}</span>
</button>
{% endif %}
