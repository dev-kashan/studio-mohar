<a href="/shop/design/{{ design.slug }}/{% if occasion %}?from={{ occasion.slug }}{% endif %}" class="sm-design-card">
    <div class="sm-design-media{% if design.card_alt %} has-alt{% endif %}">
        {% if design.personalization_badge %}<span class="sm-badge">{{ design.personalization_badge }}</span>{% endif %}
        <img class="sm-main" src="{{ design.card_main }}" alt="{{ design.name }}" loading="lazy">
        {% if design.card_alt %}<img class="sm-alt" src="{{ design.card_alt }}" alt="" loading="lazy" aria-hidden="true">{% endif %}
    </div>
    <span class="sm-design-name">{{ design.name }}</span>
    <span class="sm-design-meta">{{ currency }}{{ design.price }}{% if not hide_colours and design.color_count > 1 %} &middot; {{ design.color_count }} colours{% endif %}</span>
</a>
